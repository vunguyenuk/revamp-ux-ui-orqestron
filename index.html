<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orqestron — Form Editor</title>
  <style>/* [project]/app/globals.css [app-client] (css) */
:root {
  --ink: #27221d;
  --muted: #88827a;
  --line: #dedbd4;
  --accent: #c36d46;
}

* {
  box-sizing: border-box;
}

html, body {
  min-width: 320px;
  min-height: 100%;
  color: var(--ink);
  background: #f6f4ef;
  margin: 0;
}

body {
  -webkit-font-smoothing: antialiased;
  font-family: Inter, Helvetica Neue, Arial, sans-serif;
}

button, input {
  color: inherit;
  font: inherit;
}

button {
  cursor: pointer;
}

/* [project]/app/form-editor.css [app-client] (css) */
:root {
  --fe-bg: #f7f3f0;
  --fe-surface: #fffdfb;
  --fe-line: #ddd8d4;
  --fe-ink: #26201c;
  --fe-muted: #716a65;
  --fe-accent: #c2663e;
  --fe-accent-dark: #8c4224;
  --fe-blue: #0c7dc3;
  --space-xl: 24px;
}

@supports (color: lab(0% 0 0)) {
  :root {
    --fe-bg: lab(96.1755% .683308 2.1588);
    --fe-surface: lab(99.4219% .339001 1.0777);
    --fe-line: lab(86.6644% .917524 2.88241);
    --fe-ink: lab(12.9592% 2.41732 3.85351);
    --fe-muted: lab(45.4563% 2.05749 4.01788);
    --fe-accent: lab(53.8314% 35.4591 39.3627);
    --fe-accent-dark: lab(37.7014% 30.5546 33.4385);
    --fe-blue: lab(49.6582% -8.68848 -45.44);
  }
}

.form-editor {
  background: var(--fe-bg);
  width: 100%;
  min-width: 1100px;
  height: 100vh;
  color: var(--fe-ink);
  grid-template-rows: 56px 64px 1fr;
  font-family: Avenir Next, Segoe UI, sans-serif;
  display: grid;
  overflow: hidden;
}

.fe-icon {
  stroke-width: 1.8px;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.form-editor button:focus-visible, .form-editor input:focus-visible {
  outline: 2px solid var(--fe-accent);
  outline-offset: 2px;
}

.fe-heading {
  align-items: center;
  gap: var(--space-xl);
  padding: 0 var(--space-xl);
  border-bottom: 1px solid var(--fe-line);
  background: var(--fe-surface);
  grid-template-columns: auto minmax(300px, 1fr) auto;
  display: grid;
}

.fe-close {
  border: 1px solid var(--fe-line);
  height: 38px;
  color: var(--fe-blue);
  background: none;
  border-radius: 5px;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  font-weight: 650;
  display: inline-flex;
}

.fe-title {
  white-space: nowrap;
  text-overflow: ellipsis;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 16px;
  display: flex;
  overflow: hidden;
}

.fe-title button {
  background: none;
  border: 0;
  place-items: center;
  width: 32px;
  height: 32px;
  display: grid;
}

.fe-heading > b {
  font-size: 13px;
}

.fe-toolbar {
  padding: 0 var(--space-xl);
  border-bottom: 1px solid var(--fe-line);
  background: #faf8f6;
  background: lab(97.6825% .453204 1.43769);
  justify-content: space-between;
  align-items: center;
  display: flex;
  box-shadow: 0 2px 5px #1a151214;
  box-shadow: 0 2px 5px lab(7.20476% 1.68892 2.90778 / .08);
}

.fe-zoom {
  align-items: center;
  gap: 14px;
  display: flex;
}

.fe-zoom button {
  border: 1px solid var(--fe-line);
  background: var(--fe-surface);
  border-radius: 5px;
  align-items: center;
  gap: 10px;
  height: 36px;
  padding: 0 12px;
  display: flex;
}

.fe-zoom i {
  color: var(--fe-muted);
  font-style: normal;
}

.fe-tool-actions {
  align-self: stretch;
  display: flex;
}

.fe-tool-actions button {
  border: 0;
  border-left: 1px solid var(--fe-line);
  min-width: 66px;
  color: var(--fe-blue);
  background: none;
  align-content: center;
  place-items: center;
  gap: 3px;
  font-size: 11px;
  display: grid;
}

.fe-tool-actions button:hover {
  background: var(--fe-surface);
}

.fe-content {
  grid-template-columns: minmax(560px, 1fr) 376px 76px;
  min-height: 0;
  display: grid;
}

.fe-canvas {
  background: #e9e6e2;
  background: lab(91.3035% .683785 2.15908);
  min-width: 0;
  position: relative;
  overflow: auto;
}

.fe-info {
  background: var(--fe-blue);
  color: #fff;
  border: 0;
  border-radius: 50%;
  place-items: center;
  width: 44px;
  height: 44px;
  display: grid;
  position: fixed;
  bottom: 14px;
  left: 14px;
  box-shadow: 0 3px 10px #0a172340;
  box-shadow: 0 3px 10px lab(7.17828% -2.5712 -9.84598 / .25);
}

.fe-context {
  border-left: 1px solid var(--fe-line);
  background: var(--fe-surface);
  grid-template-rows: 76px 1fr;
  min-width: 0;
  min-height: 0;
  display: grid;
}

.fe-context > header {
  border-bottom: 1px solid var(--fe-line);
  justify-content: space-between;
  align-items: flex-start;
  padding: 14px 16px;
  display: flex;
}

.fe-context > header h2 {
  margin: 0;
  font-size: 20px;
}

.fe-context > header p {
  color: var(--fe-muted);
  margin: 2px 0 0;
  font-size: 11px;
}

.fe-context > header > button {
  width: 36px;
  height: 36px;
  color: var(--fe-muted);
  background: none;
  border: 0;
  place-items: center;
  display: grid;
}

.fe-mode-rail {
  border-left: 1px solid var(--fe-line);
  background: #f8f6f4;
  background: lab(97.1025% .453204 1.43771);
  flex-direction: column;
  display: flex;
}

.fe-mode-rail button {
  border: 0;
  border-bottom: 1px solid var(--fe-line);
  height: 92px;
  color: var(--fe-muted);
  text-transform: uppercase;
  background: none;
  align-content: center;
  place-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 650;
  display: grid;
}

.fe-mode-rail button.active {
  background: var(--fe-accent);
  color: #fff;
}

.fe-mode-rail button:not(.active):hover {
  background: var(--fe-surface);
  color: var(--fe-accent-dark);
}

@media (max-width: 1180px) {
  .fe-content {
    grid-template-columns: minmax(520px, 1fr) 340px 68px;
  }

  .fe-heading {
    grid-template-columns: auto 1fr;
  }

  .fe-heading > b {
    display: none;
  }
}

@media (max-width: 820px) {
  .form-editor {
    min-width: 0;
  }

  .fe-content {
    grid-template-columns: 1fr 64px;
  }

  .fe-context {
    z-index: 300;
    width: min(380px, 100vw - 64px);
    position: fixed;
    top: 120px;
    bottom: 0;
    right: 64px;
    box-shadow: -10px 0 30px #1a151221;
    box-shadow: -10px 0 30px lab(7.20476% 1.68892 2.90778 / .13);
  }

  .fe-heading {
    padding: 0 12px;
  }

  .fe-title {
    font-size: 13px;
  }

  .fe-tool-actions button {
    min-width: 48px;
  }

  .fe-tool-actions span {
    display: none;
  }
}

/* [project]/app/polish.css [app-client] (css) */
.form-editor {
  --control-md: 40px;
  --text-xs: .6875rem;
  --text-sm: .8125rem;
  --text-md: .9375rem;
  --text-lg: 1.125rem;
  font-size: var(--text-sm);
  grid-template-rows: 56px 64px minmax(0, 1fr);
}

.fe-heading {
  gap: 20px;
}

.fe-close {
  min-width: 92px;
  height: var(--control-md);
  justify-content: center;
}

.fe-title {
  font-size: var(--text-md);
  gap: 6px;
  font-weight: 500;
}

.fe-heading > b {
  font-size: var(--text-sm);
  font-weight: 650;
}

.fe-title button, .fe-context > header > button {
  width: var(--control-md);
  height: var(--control-md);
}

.fe-toolbar {
  padding-inline: 24px 0;
}

.fe-zoom button {
  min-width: 112px;
  height: var(--control-md);
  justify-content: space-between;
}

.fe-tool-actions button {
  min-width: 66px;
  min-height: 64px;
  font-size: var(--text-xs);
}

.fe-tool-actions .fe-icon {
  width: 17px;
  height: 17px;
}

.fe-content {
  grid-template-columns: minmax(560px, 1fr) 392px 68px;
}

.fe-context {
  grid-template-rows: 76px minmax(0, 1fr);
}

.fe-context > header {
  align-items: center;
  padding: 12px 16px;
}

.fe-context > header h2 {
  font-size: var(--text-lg);
  line-height: 1.2;
}

.fe-context > header p {
  font-size: var(--text-xs);
  line-height: 1.35;
}

.fe-mode-rail button {
  letter-spacing: .04em;
  gap: 8px;
  height: 92px;
  font-size: .625rem;
}

.fe-mode-rail .fe-icon {
  width: 18px;
  height: 18px;
}

.form-editor button {
  transition: background-color .14s, color .14s, transform .14s;
}

.form-editor button:active {
  transform: scale(.97);
}

.fe-close:hover, .fe-zoom button:hover {
  background: #f6f1ec;
  background: lab(95.355% 1.13425 2.78125);
}

@media (max-width: 1180px) {
  .fe-content {
    grid-template-columns: minmax(520px, 1fr) 360px 64px;
  }

  .fe-heading {
    gap: 12px;
    padding-inline: 16px;
  }

  .fe-close {
    min-width: 84px;
  }
}

@media (max-width: 820px) {
  .form-editor {
    grid-template-rows: 56px 56px minmax(0, 1fr);
  }

  .fe-content {
    grid-template-columns: minmax(0, 1fr) 60px;
  }

  .fe-context {
    top: 112px;
    right: 60px;
  }

  .fe-tool-actions button {
    min-width: 52px;
    min-height: 56px;
  }

  .fe-mode-rail button {
    height: 76px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .form-editor *, .form-editor :before, .form-editor :after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}

/* [project]/app/orqestron-editor.css [app-client] (css) */
.oq-editor {
  --oq-ink: #241e1a;
  --oq-muted: #6e6762;
  --oq-line: #dfdad5;
  --oq-paper: #fffdfa;
  --oq-soft: #f9f3ee;
  --oq-accent: #cc6438;
  --oq-accent-dark: #944221;
  --oq-accent-soft: #ffe5da;
  --oq-panel-title-size: 20px;
  --oq-shell-inset: 24px;
  color: var(--oq-ink);
  letter-spacing: -.008em;
  font-family: Avenir Next, Avenir, Helvetica Neue, sans-serif;
  font-weight: 450;
}

@supports (color: lab(0% 0 0)) {
  .oq-editor {
    --oq-ink: lab(11.7989% 2.42233 3.85784);
    --oq-muted: lab(44.2962% 2.05874 4.01877);
    --oq-line: lab(87.2405% 1.13416 3.20225);
    --oq-paper: lab(99.3065% .453115 1.43766);
    --oq-soft: lab(96.2886% 1.13216 3.20095);
    --oq-accent: lab(54.8411% 40.2742 44.0677);
    --oq-accent-dark: lab(38.7565% 33.8391 36.4103);
    --oq-accent-soft: lab(92.8494% 8.49694 9.65247);
  }
}

.oq-editor .fe-heading {
  padding-inline: var(--oq-shell-inset);
  background: var(--oq-paper);
  border-color: var(--oq-line);
  grid-template-columns: 96px minmax(320px, 1fr) auto;
  gap: 12px;
}

.oq-editor .fe-close {
  width: 96px;
  min-width: 96px;
  height: 44px;
  color: var(--oq-ink);
  background: var(--oq-paper);
  border-color: #d6cbc5;
  border-color: lab(82.5541% 2.92388 4.74211);
  border-radius: 6px;
  gap: 10px;
  padding: 0;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
}

.oq-editor .fe-close .fe-icon {
  stroke-width: 1.65px;
  width: 18px;
  height: 18px;
}

.oq-editor .fe-title {
  letter-spacing: -.012em;
  margin: 0;
  font-size: 15px;
  font-weight: 450;
}

.oq-editor .fe-title > span {
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  overflow: hidden;
}

.oq-editor .fe-title button {
  flex: none;
  width: 40px;
  height: 40px;
}

.oq-editor .fe-heading > b {
  letter-spacing: -.01em;
  font-size: 14px;
  font-weight: 650;
}

.oq-editor .fe-toolbar {
  padding-inline: var(--oq-shell-inset) 0;
  border-color: var(--oq-line);
  box-shadow: none;
  background: #fcf9f5;
  background: lab(98.0273% .782311 2.11562);
}

.oq-editor .fe-zoom {
  gap: 18px;
}

.oq-editor .fe-zoom > button {
  background: var(--oq-paper);
  border-color: #d5ccc5;
  border-color: lab(82.5734% 2.37951 4.67303);
  border-radius: 6px;
  width: 113px;
  min-width: 113px;
  height: 44px;
  padding: 0 16px;
  font-size: 13px;
}

.oq-editor .fe-zoom > span, .oq-editor .fe-zoom > i {
  font-size: 13px;
}

.oq-editor .fe-tool-actions button {
  color: #5d554f;
  border-color: var(--oq-line);
  letter-spacing: 0;
  min-width: 66px;
  font-size: 12px;
}

.oq-editor .fe-tool-actions .fe-icon {
  stroke-width: 1.6px;
  width: 19px;
  height: 19px;
}

.oq-editor .fe-tool-actions button:hover {
  color: var(--oq-accent-dark);
  background: var(--oq-accent-soft);
}

.oq-editor a:focus-visible, .oq-editor textarea:focus-visible {
  outline: 2px solid var(--oq-accent);
  outline-offset: 2px;
}

.oq-editor label:has(input:focus-visible) {
  outline: 2px solid var(--oq-accent);
  outline-offset: 2px;
}

.oq-editor .oq-catalog input:focus-visible {
  outline: none;
}

.oq-editor .fe-content {
  grid-template-columns: minmax(560px, 1fr) 404px 68px;
}

.oq-editor.oq-panel-collapsed .fe-content {
  grid-template-columns: minmax(560px, 1fr) 68px;
}

.oq-toast {
  z-index: 120;
  max-width: min(520px, 100vw - 32px);
  min-height: 44px;
  color: var(--oq-ink);
  background: #fffdfa;
  border: 1px solid #d9c9bf;
  border-radius: 10px;
  align-items: center;
  gap: 12px;
  padding: 10px 10px 10px 14px;
  font-size: 12px;
  display: flex;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 12px 36px #2b1d1530;
}

.oq-toast button {
  background: var(--oq-soft);
  border: 0;
  border-radius: 7px;
  place-items: center;
  width: 30px;
  height: 30px;
  display: grid;
}

.oq-editor .fe-page {
  width: min(960px, 100% - 280px);
  margin-left: auto;
  margin-right: auto;
}

.oq-pdf-frame {
  object-fit: contain;
  object-position: center top;
  width: 100%;
  height: 100%;
  box-shadow: none;
  background: none;
  border: 0;
  margin: 0;
  display: block;
}

.oq-pdf-stage {
  aspect-ratio: 8.5 / 11;
  width: calc(77.2727vh - 117.455px);
  max-width: 100%;
  height: auto;
  margin: 16px auto;
  scroll-margin-top: 16px;
  position: relative;
  container-type: inline-size;
}

.oq-pdf-field {
  z-index: 3;
  cursor: pointer;
  background: #cde5fb61;
  background: lab(89.5355% -4.64872 -13.8081 / .38);
  border: 1px solid #6fa4d46b;
  border: 1px solid lab(65.0269% -8.10799 -30.289 / .42);
  padding: 0;
  position: absolute;
  overflow: hidden;
}

.oq-pdf-field.is-checkbox {
  background: none;
  border-color: #0000;
}

.oq-pdf-field:hover, .oq-pdf-field:focus-visible {
  border-color: var(--oq-accent);
  background: color-mix(in srgb, var(--oq-accent) 10%, transparent);
}

.oq-pdf-field.has-value {
  background: #bbdcfba3;
  background: lab(86.031% -6.08984 -18.8624 / .64);
  border-color: #1674c58c;
  border-color: lab(46.955% -2.33978 -50.5812 / .55);
}

.oq-pdf-field > span {
  color: #003977;
  color: lab(22.8299% 12.7228 -54.6314);
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
  place-items: center;
  font-size: clamp(9px, 1.7cqw, 16px);
  font-weight: 700;
  line-height: 1;
  display: grid;
  position: absolute;
  inset: 0 2px;
  overflow: hidden;
}

.oq-pdf-field.is-signature > span {
  font-style: italic;
  font-weight: 650;
}

.oq-pdf-field.checked:after {
  content: "✓";
  color: var(--oq-accent-dark);
  place-items: center;
  font-size: clamp(10px, 1.45cqw, 15px);
  font-weight: 850;
  display: grid;
  position: absolute;
  inset: -3px;
}

.oq-field-popover {
  z-index: 60;
  width: min(360px, 100% - 24px);
  max-height: min(440px, 100cqh - 24px);
  color: var(--oq-ink);
  background: #fffbf8;
  background: lab(98.8252% 1.09521 1.93092);
  border: 1px solid #cec1b9;
  border: 1px solid lab(79.0722% 3.35187 5.83663);
  border-radius: 10px;
  display: grid;
  position: absolute;
  overflow: auto;
  box-shadow: 0 18px 48px #291c1547;
  box-shadow: 0 18px 48px lab(11.6904% 6.32039 7.13818 / .28);
}

.oq-field-popover > header {
  border-bottom: 1px solid var(--oq-line);
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 14px 14px 12px;
  display: flex;
}

.oq-field-popover > header small {
  color: var(--oq-accent-dark);
  letter-spacing: .11em;
  margin-bottom: 4px;
  font-size: 9px;
  font-weight: 750;
  display: block;
}

.oq-field-popover > header h3 {
  letter-spacing: -.012em;
  max-width: 29ch;
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
}

.oq-field-popover > header button {
  width: 32px;
  height: 32px;
  color: var(--oq-muted);
  background: none;
  border: 0;
  border-radius: 6px;
  flex: none;
  place-items: center;
  display: grid;
}

.oq-field-popover > header button:hover {
  background: var(--oq-soft);
  color: var(--oq-ink);
}

.oq-field-popover > label {
  gap: 6px;
  padding: 13px 14px 0;
  display: grid;
}

.oq-field-popover > label > span, .oq-field-suggestions > small {
  color: var(--oq-muted);
  font-size: .75rem;
  font-weight: 650;
  line-height: 1.35;
}

.oq-field-popover > label input {
  width: 100%;
  height: 40px;
  color: var(--oq-ink);
  background: #fff;
  background: lab(100% 0 0);
  border: 1px solid #c4b4a9;
  border: 1px solid lab(74.4137% 4.51717 7.81703);
  border-radius: 7px;
  padding: 0 11px;
  font-size: 13px;
}

.oq-editor .oq-field-popover > label:has(input:focus-visible) {
  outline: 0;
}

.oq-field-popover > label input:focus {
  border-color: var(--oq-accent);
  outline: 2px solid color-mix(in srgb, var(--oq-accent) 16%, transparent);
  outline-offset: 1px;
}

.oq-field-suggestions {
  gap: 8px;
  padding: 12px 14px 0;
  display: grid;
}

.oq-field-suggestions button {
  background: var(--oq-soft);
  min-height: 46px;
  color: var(--oq-ink);
  text-align: left;
  border: 0;
  border-radius: 6px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  font-size: .8125rem;
  font-weight: 500;
  line-height: 1.4;
  display: grid;
}

.oq-field-suggestions button > span {
  overflow-wrap: anywhere;
  min-width: 0;
}

.oq-provenance-badge {
  letter-spacing: .015em;
  white-space: nowrap;
  border: 1px solid #0000;
  border-radius: 999px;

            const name = formLabel(item);
            const on = selected.has(name);
            const row = document.createElement('button');
            row.className = on ? 'selected' : '';
            row.setAttribute('role', 'checkbox');
            row.setAttribute('aria-checked', on ? 'true' : 'false');
            row.innerHTML = '<span class="oq-checkbox">' + (on ? checkIcon : '') + '</span><span class="oq-form-name"><em>[' + item.c + ']</em> <span></span></span>';
            row.querySelector('.oq-form-name span').textContent = item.t;
            row.addEventListener('click', () => {
              const now = !selected.has(name);
              now ? selected.add(name) : selected.delete(name);
              row.className = now ? 'selected' : '';
              row.setAttribute('aria-checked', now ? 'true' : 'false');
              row.querySelector('.oq-checkbox').innerHTML = now ? checkIcon : '';
              count.innerHTML = checkIcon + ' ' + selected.size + ' selected';
              confirm.disabled = !selected.size;
            });
            list.appendChild(row);
          });
          wrap.appendChild(list);
        }
        tree.appendChild(wrap);
      });
      if (!shown) {
        const empty = document.createElement('p');
        empty.className = 'oq-empty';
        empty.textContent = 'No forms match these filters. Try clearing a category or changing your search.';
        tree.appendChild(empty);
      }
      libCount.textContent = shown + (shown === 1 ? ' library' : ' libraries');
      formCount.textContent = matches.length + ' forms';
    };

    const close = () => backdrop.remove();
    backdrop.querySelector('.modal-close').addEventListener('click', close);
    backdrop.querySelector('.modal-cancel').addEventListener('click', close);
    backdrop.addEventListener('mousedown', (event) => { if (event.target === backdrop) close(); });
    search.addEventListener('input', draw);
    confirm.addEventListener('click', () => {
      selected.forEach((name) => {
        document.querySelector('.oq-doc-list').appendChild(createDocumentRow(name, 'PDF form'));
      });
      updateCount();
      close();
    });
    document.querySelector('.oq-editor').appendChild(backdrop);
    drawFilters();
    draw();
    search.focus();
  });
}
